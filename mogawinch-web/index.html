<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Pages are prerendered light, so the theme class has to land on <html> before
         the first paint or dark-mode visitors get a white flash. Runs synchronously,
         ahead of the stylesheet and the app bundle. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#121212');
          }
        } catch (e) {
          /* private mode or blocked storage: fall through to the light default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- title/description/OG are set per-route via vite-react-ssg's <Head> (see src/pages/*), so every
         real route always supplies its own - no static fallback here to avoid duplicate <title>/<meta
         name="description"> tags in the prerendered HTML. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
