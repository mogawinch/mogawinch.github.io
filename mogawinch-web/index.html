<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- title/description/OG are set per-route via vite-react-ssg's <Head> (see src/pages/*), so every
         real route always supplies its own - no static fallback here to avoid duplicate <title>/<meta
         name="description"> tags in the prerendered HTML. -->
    <script>
      // Applies the saved/system theme before first paint, so there's no
      // flash of the wrong theme. Prerendered HTML always ships in light
      // mode (the build has no notion of a visitor's preference); this
      // runs client-side, ahead of React hydration, and is the only place
      // in the app allowed to touch document at module scope.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
